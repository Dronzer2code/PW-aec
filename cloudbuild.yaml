# Google Cloud Build: test → build image → push to Artifact Registry → deploy to Cloud Run.
# Usage: gcloud builds submit --config cloudbuild.yaml
substitutions:
  _REGION: asia-south1
  _SERVICE: lifebridge
  _REPO: lifebridge
options:
  logging: CLOUD_LOGGING_ONLY
steps:
  - id: test
    name: node:22-alpine
    entrypoint: sh
    args: ['-c', 'npm ci --ignore-scripts && npm run lint && npm run typecheck && npm test']
  - id: build
    name: gcr.io/cloud-builders/docker
    args: ['build', '-t', '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$BUILD_ID', '.']
  - id: push
    name: gcr.io/cloud-builders/docker
    args: ['push', '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$BUILD_ID']
  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$BUILD_ID
      - --region=${_REGION}
      - --allow-unauthenticated
      - --set-secrets=GEMINI_API_KEY=gemini-api-key:latest
      - --memory=512Mi
      - --cpu=1
      - --concurrency=40
      - --max-instances=5
      - --timeout=90
images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$BUILD_ID
